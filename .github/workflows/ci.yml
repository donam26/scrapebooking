name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: scrapebooking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d scrapebooking_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/scrapebooking_test
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/scrapebooking_test
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: http://localhost:9000
      PROXY_URL_TEMPLATE: http://u-{country}-{session}:p@h:1
      JWT_SECRET: ci-secret-long-enough-for-startup-guard
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Start MinIO
        # Service container không truyền được `server /data`; image giống infra/docker-compose.yml.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 2; done
          docker logs minio; exit 1
      - run: uv sync --frozen
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - name: Regenerate OpenAPI snapshot (diff shown when docs/api/openapi.json is stale)
        # Không chặn pipeline: test snapshot bên dưới mới quyết định; bước này in diff và lưu
        # artifact để cập nhật file khi không chạy được app ở máy dev.
        continue-on-error: true
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../docs/api/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi.json
          if-no-files-found: error
      - run: uv run pytest -q -m "not live"

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - name: Generated API types match docs/api/openapi.json
        id: gen-api
        continue-on-error: true
        run: npm run gen:api && git diff --exit-code -- src/lib/api-types.ts
      - uses: actions/upload-artifact@v4
        with:
          name: api-types
          path: dashboard/src/lib/api-types.ts
          if-no-files-found: error
      - name: Fail when api-types.ts is stale
        if: steps.gen-api.outcome == 'failure'
        run: echo "src/lib/api-types.ts is stale: download the api-types artifact" && exit 1
      - run: npm run build

  docker:
    # Chỉ build để phát hiện image hỏng sớm (plans từng ghi "image chưa build lại" nhiều lần).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/Dockerfile
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max
