[project]
name = "scrapebooking-backend"
version = "0.1.0"
description = "Hotel competitor monitor: Booking.com availability collector, analytics, insight, API"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "arq>=0.26",
  "redis>=5.0",
  "curl_cffi>=0.7",
  "playwright>=1.45",
  "selectolax>=0.3.21",
  "boto3>=1.34",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "structlog>=24.1",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "openpyxl>=3.1",
  "openai>=1.50",
]

[project.scripts]
sb = "app.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "moto[s3]>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-boto3",
  "respx>=0.21",
  "types-openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: cần Postgres/Redis/MinIO từ docker compose",
  "live: gọi Booking.com thật, không chạy trong CI",
]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"scripts/**" = ["E501"]
"alembic/**" = ["E501", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
