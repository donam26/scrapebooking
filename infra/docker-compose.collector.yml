name: scrapebooking-collector

# Chạy worker collector trên máy khác. `.env` trên máy này phải có DATABASE_URL, REDIS_URL,
# MINIO_ENDPOINT trỏ về IP/hostname của máy trung tâm (WORKER_CHANNEL luôn là booking).
services:
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file: ../.env
    environment:
      WORKER_CHANNEL: ${WORKER_CHANNEL:-booking}
    command: ["arq", "app.worker.settings.WorkerSettings"]
    deploy:
      resources:
        limits:
          memory: 1500M
    shm_size: "512m"
    restart: unless-stopped
