global:
  scrape_interval: 15s

scrape_configs:
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9100"]
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
  - job_name: jobs
    static_configs:
      - targets: ["jobs:9100"]
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
