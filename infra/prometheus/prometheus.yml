global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Quy tắc cảnh báo (infra/prometheus/rules/*.yml) → Alertmanager → email OPS_ALERT_EMAILS.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # dns_sd: compose scale (`--scale scheduler=2`, `--scale worker-agoda=2`) trả nhiều A record.
  - job_name: scheduler
    dns_sd_configs:
      - names: ["scheduler"]
        type: A
        port: 9100
  - job_name: worker
    dns_sd_configs:
      - names: ["worker", "worker-agoda", "worker-ivivu", "worker-tripcom", "worker-mytour"]
        type: A
        port: 9100
  - job_name: jobs
    dns_sd_configs:
      - names: ["jobs"]
        type: A
        port: 9100
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
